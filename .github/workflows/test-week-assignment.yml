name: Test weekly report mapping
on:
  push:
    paths:
      - 'server.py'
      - 'test_week_assignment.py'
      - '.github/workflows/test-week-assignment.yml'
  workflow_dispatch:
jobs:
  weekly-mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_week_assignment.py
